name: Gemma 4 Lending Evaluation

on:
  workflow_dispatch:
  # One-time bootstrap trigger: run when this evaluation workflow is first added.
  push:
    branches: [main]
    paths:
      - ".github/workflows/gemma4-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: gemma4-lending-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run isolated Workers AI inference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This environment is used only to read the existing protected Cloudflare
    # inference credentials. There are no deploy, D1, or production API steps.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify Workers AI credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Cloudflare account credentials in the protected production environment."
            exit 1
          fi
          echo "Cloudflare inference credentials are present. Values are not displayed."

      - name: Run 40 synthetic conversations against Gemma 4
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes tsx evals/run-gemma4-evaluation.ts

      - name: Upload raw model responses and evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemma4-lending-evaluation
          path: evals/results/
          if-no-files-found: warn
          retention-days: 14
