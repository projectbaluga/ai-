name: Resolve and verify npm lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/resolve-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked dependencies
        run: |
          npm audit --audit-level=high
          npm ci
          npm run check
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Add reproducible npm dependency lockfile"
            git push
          fi
